<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>文学风格测试结果迁移</title>
  </head>
  <body>
    <p>此页面只用于把旧版浏览器本地结果迁移到独立测试站。</p>
    <script>
      (() => {
        const targetOrigin = "https://style-test.maaoding.icu";
        const requestType = "literary-style-migration-request";
        const responseType = "literary-style-migration-response";
        const readyType = "literary-style-migration-ready";

        window.addEventListener("message", (event) => {
          if (
            event.origin !== targetOrigin
            || event.source !== window.parent
            || event.data?.type !== requestType
          ) {
            return;
          }

          let state = null;
          let theme = null;
          try {
            state = localStorage.getItem("literaryStyleTest.v4");
            theme = localStorage.getItem("literaryStyleTest.theme");
          } catch (error) {
            state = null;
            theme = null;
          }

          event.source.postMessage({ type: responseType, state, theme }, targetOrigin);
        });

        if (window.parent !== window) {
          window.parent.postMessage({ type: readyType }, targetOrigin);
        }
      })();
    </script>
  </body>
</html>
