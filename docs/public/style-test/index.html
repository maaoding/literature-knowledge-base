<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="referrer" content="no-referrer" />
    <title>文学风格测试已迁移</title>
    <link rel="canonical" href="https://style-test.maaoding.icu/" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        color: #1d2528;
        background: #f6f1e8;
        place-items: center;
      }

      main {
        width: min(560px, calc(100% - 32px));
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
      }

      p {
        margin: 0 0 20px;
        color: #596563;
        line-height: 1.8;
      }

      a {
        color: #a73a35;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #eef1ee;
          background: #101619;
        }

        p {
          color: #b8c1be;
        }

        a {
          color: #e46d66;
        }
      }
    </style>
    <script>
      (() => {
        const target = new URL("https://style-test.maaoding.icu/");
        const route = window.location.hash.slice(1);
        const routes = new Set(["home", "quiz", "result", "map", "method", "library", "knowledge"]);
        if (routes.has(route)) target.hash = route;
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>文学风格测试已迁移</h1>
      <p>测试站已经使用独立域名。旧测试结果会在新站首次打开时尝试从本浏览器迁移。</p>
      <a href="https://style-test.maaoding.icu/">前往文学风格测试</a>
    </main>
  </body>
</html>
